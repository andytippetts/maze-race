<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maze Race</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg: #fbf3dc;
    --card: #fffaf0;
    --ink: #2b2118;
    --muted: #7a6a55;
    --line: #ead9b0;
    --straw: #e9b949;
    --straw-deep: #c98f12;
    --barn: #c0392b;
    --barn-ink: #ffffff;
    --grass: #2e8b57;
    --sky: #2f7fc1;
    --shadow: 0 2px 0 rgba(43, 33, 24, .08), 0 8px 24px rgba(43, 33, 24, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1d1812; --card: #2a231a; --ink: #f6ecd6; --muted: #b9a888; --line: #43382a;
      --straw: #f0c35a; --straw-deep: #f0c35a; --barn: #e0574a; --grass: #4fbf82; --sky: #64a9e6;
      --shadow: 0 8px 24px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1d1812; --card: #2a231a; --ink: #f6ecd6; --muted: #b9a888; --line: #43382a;
    --straw: #f0c35a; --straw-deep: #f0c35a; --barn: #e0574a; --grass: #4fbf82; --sky: #64a9e6;
    --shadow: 0 8px 24px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
    min-height: 100vh;
  }
  h1, h2, h3, .display { font-family: "Fredoka", system-ui, sans-serif; letter-spacing: .01em; }
  h1 { font-size: 2rem; margin: 0 0 .25rem; line-height: 1.1; }
  h2 { font-size: 1.35rem; margin: 1.5rem 0 .6rem; }
  p { margin: .4rem 0; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  .wrap.wide { max-width: 980px; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: "Fredoka", sans-serif; font-weight: 700;
           color: var(--straw-deep); font-size: 1.05rem; margin-bottom: 14px; }
  .brand svg { width: 26px; height: 26px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; box-shadow: var(--shadow); }
  .card + .card { margin-top: 14px; }
  .center { text-align: center; }
  .muted { color: var(--muted); }
  .small { font-size: .88rem; }

  .clock { font-family: "Fredoka", sans-serif; font-weight: 700; font-variant-numeric: tabular-nums;
           font-size: clamp(3.4rem, 19vw, 6rem); line-height: 1; margin: 10px 0 6px; }
  .clock .tenth { font-size: .5em; color: var(--muted); }

  .banner { border-radius: 18px; padding: 18px; text-align: center; margin-bottom: 14px;
            font-family: "Fredoka", sans-serif; animation: pop .45s cubic-bezier(.2, 1.6, .4, 1) both; }
  .banner .big { font-size: 2.4rem; font-weight: 700; line-height: 1.05; }
  .banner .sub { font-size: 1.1rem; font-weight: 500; margin-top: 4px; }
  .banner.good { background: var(--grass); color: #fff; }
  .banner.go { background: var(--sky); color: #fff; }
  .banner.finish { background: var(--barn); color: #fff; }
  .banner.meh { background: var(--line); color: var(--ink); }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .banner { animation: none; } }

  .stats { display: flex; gap: 10px; margin-top: 14px; }
  .stat { flex: 1; background: var(--bg); border-radius: 14px; padding: 10px 12px; text-align: center; }
  .stat b { display: block; font-family: "Fredoka", sans-serif; font-size: 1.5rem; }
  .stat span { font-size: .85rem; color: var(--muted); }

  .breakdown { width: 100%; border-collapse: collapse; margin-top: 12px; font-variant-numeric: tabular-nums; }
  .breakdown td { padding: 8px 4px; border-top: 1px solid var(--line); }
  .breakdown td:last-child { text-align: right; font-weight: 600; }
  .breakdown tr.total td { font-family: "Fredoka", sans-serif; font-size: 1.3rem; border-top: 2px solid var(--ink); }

  input[type=text], input[type=number], input[type=password], input[inputmode] {
    width: 100%; font: inherit; font-size: 1.2rem; padding: 14px 16px; border-radius: 14px;
    border: 2px solid var(--line); background: var(--bg); color: var(--ink);
  }
  input:focus { outline: none; border-color: var(--straw); }
  button, .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font: 600 1rem "Fredoka", system-ui, sans-serif; border: 0; border-radius: 14px; cursor: pointer;
    padding: 12px 18px; background: var(--line); color: var(--ink); text-decoration: none;
  }
  button:disabled { opacity: .55; cursor: default; }
  .btn-big { width: 100%; font-size: 1.5rem; padding: 18px; margin-top: 12px; }
  .btn-go { background: var(--grass); color: #fff; }
  .btn-red { background: var(--barn); color: var(--barn-ink); }
  .btn-link { background: none; padding: 6px 0; color: var(--sky); font-weight: 600; }
  .stack > * + * { margin-top: 10px; }
  .error { color: var(--barn); font-weight: 600; margin-top: 10px; }

  .team-pick { width: 100%; justify-content: space-between; font-size: 1.15rem; background: var(--bg);
               border: 2px solid var(--line); padding: 14px 16px; }
  .footer-links { margin-top: 22px; text-align: center; display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }

  /* Scoreboard */
  .board-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .board-list { list-style: none; margin: 0; padding: 0; }
  .board-list li { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 12px;
                   padding: 12px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); margin-bottom: 8px; }
  .rank { font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 1.5rem; text-align: center; }
  .team-name { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 1.3rem; overflow-wrap: anywhere; }
  .team-detail { font-size: .88rem; color: var(--muted); }
  .team-time { font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 1.7rem; font-variant-numeric: tabular-nums; text-align: right; }
  .board-list li.first { background: var(--straw); border-color: var(--straw-deep); color: #2b2118; }
  .board-list li.first .team-detail { color: #5a4520; }
  .live-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--barn);
              margin-right: 6px; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .empty { padding: 18px; text-align: center; color: var(--muted); border: 2px dashed var(--line); border-radius: 14px; }
  @media (min-width: 900px) {
    .board-cols { display: grid; grid-template-columns: 3fr 2fr; gap: 28px; }
    .board .team-time { font-size: 2.2rem; }
    .board .team-name { font-size: 1.6rem; }
  }

  /* Admin */
  .tag-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .tag-card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); }
  .kind { display: inline-block; font: 700 .75rem "Fredoka", sans-serif; text-transform: uppercase; letter-spacing: .08em;
          padding: 3px 10px; border-radius: 99px; color: #fff; }
  .kind.start { background: var(--sky); } .kind.bonus { background: var(--grass); } .kind.finish { background: var(--barn); }
  .tag-card label { display: block; font-size: .82rem; color: var(--muted); margin-top: 10px; }
  .tag-card input { font-size: 1rem; padding: 10px 12px; border-radius: 10px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .qr { display: flex; justify-content: center; background: #fff; padding: 10px; border-radius: 12px; margin-top: 12px; }
  .qr img, .qr canvas { width: 150px !important; height: 150px !important; }
  .url { font: .78rem ui-monospace, Menlo, monospace; word-break: break-all; background: var(--bg); padding: 8px; border-radius: 8px; margin-top: 10px; }
  .print-title { display: none; }
  ol.howto { padding-left: 1.3rem; } ol.howto li { margin: .35rem 0; }

  @media print {
    body { background: #fff; color: #000; }
    .no-print { display: none !important; }
    .tag-grid { grid-template-columns: repeat(2, 1fr); }
    .tag-card { box-shadow: none; border: 2px dashed #999; break-inside: avoid; text-align: center; }
    .tag-card .edit, .tag-card .url, .tag-card .actions { display: none; }
    .print-title { display: block; font: 700 1.8rem "Fredoka", sans-serif; margin: 6px 0; }
    .qr img, .qr canvas { width: 220px !important; height: 220px !important; }
  }
</style>
</head>
<body>
<main id="app" class="wrap"><p class="muted">Loading…</p></main>

<script>
// ============ SETTINGS (filled in once) ============
const SUPABASE_URL = "https://dlmkbmtafdoqezzxhqsb.supabase.co";
const SUPABASE_KEY = "sb_publishable_kZbtXBNFrrEjxPD5dl1kPQ_eGWb1Nc8";
// ===================================================

const app = document.getElementById("app");
const params = new URLSearchParams(location.search);
const BASE_URL = location.origin + location.pathname;
const TEAM_KEY = "maze_team_id";
const PIN_KEY = "maze_admin_pin";
let serverOffset = 0;   // server clock minus phone clock, in ms
let ticker = null;

const LOGO = `<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="7" fill="currentColor"/>
  <path d="M8 8h16v4H12v4h8v8H8v-4h8v-4H8z" fill="none" stroke="var(--card)" stroke-width="2.4" stroke-linejoin="round"/></svg>`;

// ---------- helpers ----------
function store(kind, key, value) {
  try {
    const s = kind === "session" ? sessionStorage : localStorage;
    if (value === undefined) return s.getItem(key);
    if (value === null) s.removeItem(key); else s.setItem(key, value);
  } catch (e) { return null; }
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function setNow(serverNow) { if (serverNow) serverOffset = Date.parse(serverNow) - Date.now(); }
function nowMs() { return Date.now() + serverOffset; }

function fmt(ms, tenths = true) {
  ms = Math.max(0, ms);
  const totalTenths = Math.floor(ms / 100);
  const t = totalTenths % 10;
  const s = Math.floor(totalTenths / 10) % 60;
  const m = Math.floor(totalTenths / 600);
  const main = `${m}:${String(s).padStart(2, "0")}`;
  return tenths ? `${main}<span class="tenth">.${t}</span>` : main;
}
function fmtPlain(ms) { return fmt(ms, true).replace(/<[^>]+>/g, ""); }
function secs(n) { return n >= 60 ? `${Math.floor(n / 60)}:${String(n % 60).padStart(2, "0")}` : `${n} sec`; }

function rawMs(team) {
  const end = team.finished_at ? Date.parse(team.finished_at) : nowMs();
  return end - Date.parse(team.started_at);
}
function finalMs(team) { return Math.max(0, rawMs(team) - team.bonus_seconds * 1000); }

async function rpc(name, args = {}) {
  const headers = { "Content-Type": "application/json", apikey: SUPABASE_KEY };
  if (SUPABASE_KEY.startsWith("eyJ")) headers.Authorization = "Bearer " + SUPABASE_KEY;
  let lastErr;
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`, { method: "POST", headers, body: JSON.stringify(args) });
      const body = await r.json().catch(() => null);
      if (!r.ok) {
        const err = new Error(body?.message || `Something went wrong (${r.status})`);
        err.fatal = true;
        throw err;
      }
      return body;
    } catch (e) {
      lastErr = e;
      if (e.fatal) throw e;
      await new Promise(res => setTimeout(res, 700 * (attempt + 1)));
    }
  }
  throw new Error("Couldn't reach the internet. Move a little and tap the sticker again.");
}

function shell(inner, wide = false) {
  stopTicker();
  app.className = "wrap" + (wide ? " wide" : "");
  app.innerHTML = `<div class="brand">${LOGO}<span>Maze Race</span></div>${inner}`;
}
function stopTicker() { if (ticker) { clearInterval(ticker); ticker = null; } }
function startTicker(fn) { stopTicker(); fn(); ticker = setInterval(fn, 100); }
function showError(msg) {
  shell(`<div class="card center"><h1>Uh-oh</h1><p>${esc(msg)}</p>
    <button class="btn-big" onclick="location.reload()">Try again</button></div>`);
}

// ---------- phone screens ----------

function teamCard(team, total) {
  const done = !!team.finished_at;
  return `<div class="card center">
    <div class="muted small">${done ? "Team finished" : "Team in the maze"}</div>
    <h1>${esc(team.name)}</h1>
    <div class="clock" id="clock">${fmt(rawMs(team))}</div>
    <div class="muted small">${done ? "maze time" : "clock is running"}</div>
    <div class="stats">
      <div class="stat"><b>${team.found}/${total}</b><span>bonus stickers</span></div>
      <div class="stat"><b>−${secs(team.bonus_seconds)}</b><span>time off</span></div>
    </div>
    ${done ? "" : `<p class="muted small" style="margin-top:14px">Find bonus stickers to take time off. Tap the <b>FINISH</b> sticker at the exit!</p>`}
  </div>`;
}

function runningScreen(team, total, bannerHtml = "") {
  if (team.finished_at) return finishedScreen(team, total, bannerHtml);
  shell(`${bannerHtml}${teamCard(team, total)}
    <div class="footer-links"><a class="btn-link" href="${BASE_URL}?board">See the scoreboard</a></div>`);
  startTicker(() => { const el = document.getElementById("clock"); if (el) el.innerHTML = fmt(rawMs(team)); });
}

function finishedScreen(team, total, bannerHtml = "") {
  shell(`${bannerHtml || `<div class="banner finish"><div class="big">FINISHED!</div></div>`}
    <div class="card center">
      <div class="muted small">Final time for</div>
      <h1>${esc(team.name)}</h1>
      <div class="clock">${fmt(finalMs(team))}</div>
      <table class="breakdown">
        <tr><td>Maze time</td><td>${fmtPlain(rawMs(team))}</td></tr>
        <tr><td>Bonus stickers (${team.found} of ${total})</td><td>−${secs(team.bonus_seconds)}</td></tr>
        <tr class="total"><td>Final time</td><td>${fmtPlain(finalMs(team))}</td></tr>
      </table>
      <p class="muted small" style="margin-top:14px">Show this screen at the exit!</p>
    </div>
    <div class="footer-links"><a class="btn-link" href="${BASE_URL}?board">See the scoreboard</a></div>`);
}

function nameForm(code, runningTeam) {
  const warn = runningTeam ? `<div class="card" style="margin-bottom:14px">
      <p><b>${esc(runningTeam.name)}</b> is still in the maze on this phone.</p>
      <a class="btn" href="${BASE_URL}">Go back to ${esc(runningTeam.name)}</a></div>` : "";
  shell(`${warn}<div class="card">
      <h1>Ready to race?</h1>
      <p class="muted">Type your team name, then press START. The clock begins the moment you press it!</p>
      <form id="startForm" class="stack" style="margin-top:14px" autocomplete="off">
        <input type="text" id="teamName" maxlength="40" placeholder="Team name" required>
        <button class="btn-big btn-go" id="goBtn" type="submit">START!</button>
        <div id="err" class="error" hidden></div>
      </form>
    </div>`);
  const form = document.getElementById("startForm");
  form.onsubmit = async (e) => {
    e.preventDefault();
    const name = document.getElementById("teamName").value.trim();
    if (!name) return;
    const btn = document.getElementById("goBtn");
    btn.disabled = true; btn.textContent = "Starting…";
    try {
      const res = await rpc("maze_start", { p_name: name });
      setNow(res.now);
      store("local", TEAM_KEY, res.team.id);
      runningScreen(res.team, res.total_bonus,
        `<div class="banner go"><div class="big">GO GO GO!</div><div class="sub">The clock is running</div></div>`);
    } catch (err) {
      btn.disabled = false; btn.textContent = "START!";
      const el = document.getElementById("err"); el.hidden = false; el.textContent = err.message;
    }
  };
}

async function pickTeamScreen(code) {
  const board = await rpc("maze_board");
  setNow(board.now);
  const running = board.teams.filter(t => !t.finished_at);
  shell(`<div class="card">
      <h1>Which team are you?</h1>
      <p class="muted">This phone doesn't know your team yet. Tap your team's name.</p>
      <div class="stack" style="margin-top:14px">
        ${running.length ? running.map(t => `<button class="team-pick" data-id="${esc(t.id)}">
            <span>${esc(t.name)}</span><span class="muted small">${fmtPlain(rawMs(t))}</span></button>`).join("")
          : `<div class="empty">No teams are in the maze right now.</div>`}
      </div>
      <p class="muted small" style="margin-top:16px">Haven't started yet? Find the <b>START</b> sticker at the entrance.</p>
    </div>`);
  app.querySelectorAll(".team-pick").forEach(b => b.onclick = () => {
    store("local", TEAM_KEY, b.dataset.id);
    handleScan(code);
  });
}

async function handleScan(code) {
  shell(`<div class="card center"><p class="muted">Checking sticker…</p></div>`);
  const teamId = store("local", TEAM_KEY);
  let res;
  try {
    res = await rpc("maze_scan", { p_code: code, p_team: teamId || null });
  } catch (e) { return showError(e.message); }
  setNow(res.now);
  history.replaceState(null, "", BASE_URL);   // a refresh won't re-tap the sticker
  const team = res.team, total = res.total_bonus;

  switch (res.status) {
    case "unknown":
      return shell(`<div class="card center"><h1>Hmm…</h1><p>This sticker isn't set up for the race.</p></div>`);
    case "start":
      return nameForm(code, team && !team.finished_at ? team : null);
    case "no_team":
      if (teamId) store("local", TEAM_KEY, null);
      return pickTeamScreen(code).catch(e => showError(e.message));
    case "bonus":
      return runningScreen(team, total,
        `<div class="banner good"><div class="big">BONUS! −${secs(res.seconds)}</div><div class="sub">You found ${esc(res.label)}</div></div>`);
    case "already_found":
      return runningScreen(team, total,
        `<div class="banner meh"><div class="big">Already got it!</div><div class="sub">You found ${esc(res.label)} earlier. Keep looking!</div></div>`);
    case "finished":
      return finishedScreen(team, total);
    case "already_finished":
      return finishedScreen(team, total,
        `<div class="banner meh"><div class="big">You already finished!</div><div class="sub">Tap START to race as a new team.</div></div>`);
  }
}

async function homeScreen() {
  const teamId = store("local", TEAM_KEY);
  if (teamId) {
    try {
      const res = await rpc("maze_status", { p_team: teamId });
      setNow(res.now);
      if (res.team) return runningScreen(res.team, res.total_bonus);
      store("local", TEAM_KEY, null);   // team was removed by the admin
    } catch (e) { return showError(e.message); }
  }
  shell(`<div class="card center">
      <h1>Maze Race</h1>
      <p>Find the <b>START</b> sticker at the entrance and tap your phone on it to begin.</p>
    </div>
    <div class="footer-links"><a class="btn-link" href="${BASE_URL}?board">Scoreboard</a></div>`);
}

// ---------- scoreboard ----------

async function boardScreen() {
  let data = null;
  shell(`<div class="board">
      <div class="board-head"><h1>Scoreboard</h1><span class="muted small"><span class="live-dot"></span>Live</span></div>
      <div class="board-cols">
        <section><h2>Finished</h2><ul class="board-list" id="done"></ul></section>
        <section><h2>In the maze</h2><ul class="board-list" id="running"></ul></section>
      </div>
      <p class="muted small" id="boardErr"></p>
    </div>`, true);

  function draw() {
    if (!data) return;
    const done = data.teams.filter(t => t.finished_at).sort((a, b) => finalMs(a) - finalMs(b));
    const running = data.teams.filter(t => !t.finished_at);
    const medals = ["🥇", "🥈", "🥉"];
    document.getElementById("done").innerHTML = done.length ? done.map((t, i) => `
      <li class="${i === 0 ? "first" : ""}">
        <div class="rank">${medals[i] || i + 1}</div>
        <div><div class="team-name">${esc(t.name)}</div>
          <div class="team-detail">${t.found}/${data.total_bonus} bonus stickers</div></div>
        <div class="team-time">${fmtPlain(finalMs(t))}</div>
      </li>`).join("") : `<li class="empty" style="display:block">No one has finished yet</li>`;
    document.getElementById("running").innerHTML = running.length ? running.map(t => `
      <li>
        <div class="rank">🏃</div>
        <div><div class="team-name">${esc(t.name)}</div>
          <div class="team-detail">${t.found}/${data.total_bonus} bonus stickers</div></div>
        <div class="team-time">${fmtPlain(rawMs(t))}</div>
      </li>`).join("") : `<li class="empty" style="display:block">Nobody in the maze</li>`;
  }

  async function refresh() {
    try {
      data = await rpc("maze_board");
      setNow(data.now);
      document.getElementById("boardErr").textContent = "";
      draw();
    } catch (e) {
      const el = document.getElementById("boardErr");
      if (el) el.textContent = "Reconnecting…";
    }
  }
  await refresh();
  setInterval(refresh, 3000);
  ticker = setInterval(draw, 100);
}

// ---------- admin ----------

async function adminScreen() {
  const pin = store("session", PIN_KEY);
  if (!pin) return pinForm();
  let data;
  try { data = await rpc("maze_admin", { p_pin: pin }); }
  catch (e) { store("session", PIN_KEY, null); return pinForm(e.message); }

  const board = await rpc("maze_board").catch(() => ({ teams: [] }));
  setNow(board.now);

  shell(`
    <div class="no-print">
      <h1>Race setup</h1>
      <p class="muted">Each card below is one sticker. Write its link onto an NFC sticker, or print the QR codes as a backup for phones without NFC.</p>
      <div class="row" style="flex-wrap:wrap;margin:14px 0 18px">
        <button class="btn-go" id="addBonus">+ Add a bonus sticker</button>
        <button id="printBtn">Print QR cards</button>
        <a class="btn" href="${BASE_URL}?board" target="_blank">Open scoreboard</a>
      </div>
    </div>
    <div class="tag-grid">
      ${data.tags.map(t => `
        <div class="tag-card" data-code="${esc(t.code)}">
          <span class="kind ${t.kind}">${t.kind}</span>
          <div class="print-title">${esc(t.label)}</div>
          <div class="edit">
            <label>Name</label><input type="text" class="f-label" value="${esc(t.label)}" maxlength="40">
            ${t.kind === "bonus" ? `<label>Seconds taken off</label><input type="number" class="f-secs" min="0" max="3600" value="${t.seconds}">` : ""}
            <div class="row actions" style="margin-top:10px">
              <button class="save">Save</button>
              ${t.kind === "bonus" ? `<button class="btn-link del" style="color:var(--barn)">Delete</button>` : ""}
              <span class="muted small saved" hidden>Saved ✓</span>
            </div>
          </div>
          <div class="qr" id="qr-${esc(t.code)}"></div>
          <div class="url">${esc(BASE_URL + "?t=" + t.code)}</div>
          <div class="row actions" style="margin-top:8px"><button class="copy">Copy link</button></div>
        </div>`).join("")}
    </div>

    <div class="no-print">
      <h2>Writing the NFC stickers</h2>
      <div class="card"><ol class="howto">
        <li>On this phone, tap <b>Copy link</b> on a card above.</li>
        <li>Open the <b>NFC Tools</b> app → <b>Write</b> → <b>Add a record</b> → <b>URL / URI</b>, paste the link, and press OK.</li>
        <li>Press <b>Write</b> and hold the phone on the sticker until it says it's done.</li>
        <li>Label the back of the sticker (Start, Bonus 1, …) so you know which is which.</li>
        <li>Test it: lock and unlock your phone, then tap the sticker. The race page should pop up.</li>
      </ol></div>

      <h2>Teams</h2>
      <div class="card">
        ${board.teams.length ? `<div class="stack">${board.teams.map(t => `
          <div class="row" style="justify-content:space-between">
            <span><b>${esc(t.name)}</b> <span class="muted small">${t.finished_at ? "finished " + fmtPlain(finalMs(t)) : "in the maze"}</span></span>
            <button class="btn-link rm" data-id="${esc(t.id)}" data-name="${esc(t.name)}" style="color:var(--barn)">Remove</button>
          </div>`).join("")}</div>` : `<p class="muted">No teams yet.</p>`}
        <button class="btn-red" id="resetAll" style="margin-top:16px">Clear all teams</button>
        <p class="muted small">Use this after testing, right before the real race.</p>
      </div>
      <p style="margin-top:18px"><button class="btn-link" id="logout">Lock this page</button></p>
    </div>`, true);

  data.tags.forEach(t => {
    const el = document.getElementById("qr-" + t.code);
    if (window.QRCode && el) new QRCode(el, { text: BASE_URL + "?t=" + t.code, width: 300, height: 300, correctLevel: QRCode.CorrectLevel.M });
  });

  app.querySelectorAll(".tag-card").forEach(card => {
    const code = card.dataset.code;
    card.querySelector(".save").onclick = async () => {
      const label = card.querySelector(".f-label").value;
      const s = card.querySelector(".f-secs");
      try {
        await rpc("maze_save_tag", { p_pin: pin, p_code: code, p_label: label, p_seconds: s ? parseInt(s.value || "0", 10) : 0 });
        const ok = card.querySelector(".saved"); ok.hidden = false; setTimeout(() => ok.hidden = true, 2000);
      } catch (e) { alert(e.message); }
    };
    const del = card.querySelector(".del");
    if (del) del.onclick = async () => {
      if (!confirm("Delete this bonus sticker? Any team that found it loses that bonus.")) return;
      try { await rpc("maze_delete_tag", { p_pin: pin, p_code: code }); adminScreen(); } catch (e) { alert(e.message); }
    };
    card.querySelector(".copy").onclick = async (ev) => {
      const link = BASE_URL + "?t=" + code;
      try { await navigator.clipboard.writeText(link); ev.target.textContent = "Copied ✓"; }
      catch (e) { prompt("Copy this link:", link); }
      setTimeout(() => ev.target.textContent = "Copy link", 2000);
    };
  });
  document.getElementById("addBonus").onclick = async () => {
    try { await rpc("maze_add_bonus", { p_pin: pin }); adminScreen(); } catch (e) { alert(e.message); }
  };
  document.getElementById("printBtn").onclick = () => window.print();
  app.querySelectorAll(".rm").forEach(b => b.onclick = async () => {
    if (!confirm(`Remove team "${b.dataset.name}"?`)) return;
    try { await rpc("maze_remove_team", { p_pin: pin, p_team: b.dataset.id }); adminScreen(); } catch (e) { alert(e.message); }
  });
  document.getElementById("resetAll").onclick = async () => {
    if (!confirm("Clear ALL teams and times? This can't be undone.")) return;
    try { await rpc("maze_reset", { p_pin: pin }); adminScreen(); } catch (e) { alert(e.message); }
  };
  document.getElementById("logout").onclick = () => { store("session", PIN_KEY, null); pinForm(); };
}

function pinForm(errMsg) {
  shell(`<div class="card">
      <h1>Race setup</h1>
      <p class="muted">Enter the admin PIN.</p>
      <form id="pinForm" class="stack" style="margin-top:12px">
        <input type="password" id="pin" inputmode="numeric" autocomplete="off" placeholder="PIN" required>
        <button class="btn-big btn-go" type="submit">Open</button>
        ${errMsg ? `<div class="error">${esc(errMsg)}</div>` : ""}
      </form>
    </div>`);
  document.getElementById("pinForm").onsubmit = (e) => {
    e.preventDefault();
    store("session", PIN_KEY, document.getElementById("pin").value.trim());
    adminScreen();
  };
}

// ---------- router ----------
if (SUPABASE_URL.startsWith("PASTE")) {
  showError("This page isn't connected to its database yet.");
} else if (params.has("t")) {
  handleScan(params.get("t"));
} else if (params.has("board")) {
  boardScreen();
} else if (params.has("admin")) {
  adminScreen();
} else {
  homeScreen();
}
</script>
</body>
</html>
